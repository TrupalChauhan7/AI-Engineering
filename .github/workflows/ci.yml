name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Phase 0 quality gate: runs the repo's own pre-commit hooks (ruff lint +
# ruff-format + secret/large-file/merge-conflict checks) so CI == local.
# A pytest job over a hermetic (model-free) test subset is added in Phase 1.
jobs:
  quality:
    name: Lint & format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files
